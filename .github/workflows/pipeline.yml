# Scheduled data pipeline: ingest -> transform -> warehouse, on a timer.
#
# ISA demonstration row 2 asks for the pipeline "running on a schedule", and what
# it is checking is "automated, not run by hand". The run history on the Actions
# tab is that evidence; `workflow_dispatch` is here so the run can also be started
# live in front of an audience.
#
# This job installs nothing. The whole chain -- fetch, validate, clean, split,
# leakage gate, warehouse load, monitor -- is standard library only, verified on a
# bare Python 3.9 virtualenv with nothing but pip and setuptools in it. That is
# deliberate: a nightly job whose first step is `pip install` fails on upstream
# releases, not on our code, and then nobody trusts the red mark.
#
# It is a real check, not a green tick. The job fails if:
#   * HinGE's pinned revision stops hashing to what data/raw/MANIFEST.json records
#   * the regenerated splits stop matching the committed manifest, byte for byte
#   * the leakage gate trips
#   * stage counts drift beyond the monitor's threshold
#
# Any of those means a number in the report has quietly stopped being true.

name: pipeline

on:
  schedule:
    - cron: "17 6 * * *"        # 06:17 UTC daily; an odd minute, off the hour, so
                                # it is not queued behind everyone else's midnight job
  workflow_dispatch:            # the "run it now" button, for the demo
  push:
    paths:                      # the pipeline's own code changing is worth a run
      - "src/lrcs/**"
      - "scripts/run_pipeline.py"
      - "scripts/fetch_data.py"
      - "scripts/validate_raw.py"
      - "scripts/load_warehouse.py"
      - "scripts/monitor_pipeline.py"
      - ".github/workflows/pipeline.yml"

permissions:
  contents: read

jobs:
  pipeline:
    # Pinned, not `ubuntu-latest`. The point of this job is to run on the oldest
    # Python the project supports -- requirements.txt holds matplotlib at 3.9.4
    # for a team machine on 3.9, and a 3.10-only call in validate_raw.py had
    # already shipped once. `ubuntu-latest` has moved to 26.04, which no longer
    # offers 3.9, so setup-python failed in seven seconds.
    #
    # When 22.04 is retired this job will fail loudly on the runner label rather
    # than quietly stop testing 3.9. At that point either move 3.9 to a container
    # or drop 3.9 support deliberately, as a decision rather than a drift.
    runs-on: ubuntu-22.04
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"   # if it runs here it runs on every team machine

      - name: Show the environment is bare
        run: |
          python -V
          pip list --format=freeze

      - name: Fetch HinGE at its pinned revision
        run: |
          python scripts/fetch_data.py --only hinge
          python scripts/fetch_data.py --verify --only hinge
          cp data/raw/hinge/HinGE.csv data/raw/hinge.csv

      - name: Validate the corpus before building on it
        # The rate is a gate, not a measurement. HinGE sits at 0.001 invented-tag;
        # the trilingual corpus we rejected sits at 0.158. 0.05 is comfortably above
        # the one we accept and far below the one we refused, so it fires if the
        # pinned revision is ever replaced by differently-aligned text.
        run: python scripts/validate_raw.py --only hinge --fail-on-misalignment 0.05

      - name: Ingest, clean, split, leakage gate
        run: python scripts/run_pipeline.py --input data/raw/hinge.csv --seed 42 --no-figures

      - name: The splits must still be the committed ones
        run: |
          python - <<'PY'
          import json, pathlib, subprocess, sys
          committed = json.loads(subprocess.run(
              ["git", "show", "HEAD:data/processed/manifests/hinge_split_manifest.json"],
              capture_output=True, text=True, check=True).stdout)
          fresh = json.loads(pathlib.Path(
              "data/processed/manifests/hinge_split_manifest.json").read_text())
          ok = committed["input_sha256"] == fresh["input_sha256"]
          print(f"{'split':<8}{'records':>9}{'committed':>18}{'this run':>18}  match")
          for s in ("train", "dev", "test"):
              c, f = committed["splits"][s], fresh["splits"][s]
              same = c["sha256"] == f["sha256"] and c["records"] == f["records"]
              ok &= same
              print(f"{s:<8}{f['records']:>9}{c['sha256'][:16]:>18}"
                    f"{f['sha256'][:16]:>18}  {same}")
          print("input sha256 match:", committed["input_sha256"] == fresh["input_sha256"])
          if not ok:
              sys.exit("splits no longer reproduce the committed manifest. Either the "
                       "upstream corpus moved or the pipeline changed behaviour. Every "
                       "number measured on these splits is now unverified.")
          print("\nsplits reproduce the committed manifest exactly")
          PY

      - name: Load the warehouse
        run: python scripts/load_warehouse.py

      - name: Warehouse contents
        run: python scripts/warehouse_demo.py

      - name: Monitor, and fail on drift
        run: |
          python scripts/monitor_pipeline.py \
            --previous reports/pipeline_monitor.json \
            --out reports/pipeline_monitor.ci.json \
            --fail-on-drift

      - name: Keep the evidence
        if: always()            # an failed run's report is the interesting one
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-${{ github.run_number }}
          path: |
            reports/pipeline_monitor.ci.json
            reports/data_statistics.json
            reports/raw_validation.json
            data/processed/manifests/
            data/raw/MANIFEST.json
            runs/
          retention-days: 30
          if-no-files-found: warn
